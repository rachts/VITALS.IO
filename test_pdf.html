<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <button onclick="generatePDF()">Test PDF</button>
    <script>
        const currentData = {
            arpa: 500,
            gross_margin_pct: 0.55,
            churn_rate: 0.09,
            cac: 13666,
            ltv: 3142,
            ltv_cac_ratio: 0.23,
            payback: 49.7,
            health_score: 5,
            aiAdvice: {
                tips: [
                    {priority: "high", category: "churn", action: "Fix churn"},
                    {priority: "medium", category: "cac", action: "Reduce cac"}
                ]
            }
        };
        const formatMoney = (val) => '$' + val;
        const formatPct = (val) => val + '%';

        function generatePDF() {
            window.jsPDF = window.jspdf.jsPDF;
            const doc = new jsPDF();
            const d = new Date();
            const dateStr = d.toLocaleDateString();

            doc.setFillColor(8, 12, 20); // #080C14
            doc.rect(0, 0, 210, 40, 'F');

            doc.setTextColor(201, 169, 110);
            doc.setFontSize(24);
            doc.text("VITALS.IO", 14, 25);

            doc.setTextColor(255, 255, 255);
            doc.setFontSize(14);
            doc.text("Financial Health Report", 130, 20);
            doc.setFontSize(10);
            doc.text("Date: " + dateStr, 130, 28);

            doc.setTextColor(0, 0, 0);
            doc.setFontSize(16);
            doc.text("Health Score: " + currentData.health_score.toFixed(1), 14, 55);

            const tableData = [
                ["ARPA", formatMoney(currentData.arpa)],
                ["Gross Margin", formatPct(currentData.gross_margin_pct)],
                ["Churn Rate", formatPct(currentData.churn_rate)],
                ["CAC", formatMoney(currentData.cac)],
                ["LTV", formatMoney(currentData.ltv)],
                ["LTV:CAC Ratio", currentData.ltv_cac_ratio.toFixed(1) + "x"],
                ["Payback Period", currentData.payback.toFixed(1) + " mo"]
            ];

            doc.autoTable({
                startY: 65,
                head: [['Metric', 'Value']],
                body: tableData,
                theme: 'grid',
                headStyles: { fillColor: [201, 169, 110], textColor: [0, 0, 0] }
            });

            const finalY = doc.lastAutoTable.finalY + 15;
            doc.text("Key Findings", 14, finalY);

            doc.setFontSize(10);
            let y = finalY + 8;

            if (currentData.ltv_cac_ratio >= 3) { doc.text("- LTV:CAC is strong.", 14, y); y += 6; }
            else { doc.text("- LTV:CAC needs attention.", 14, y); y += 6; }

            if (currentData.churn_rate <= 0.02) { doc.text("- Churn is healthy.", 14, y); y += 6; }
            else { doc.text("- Churn is high.", 14, y); y += 6; }

            if (currentData.aiAdvice && currentData.aiAdvice.tips) {
                y += 8;
                doc.setFontSize(14);
                doc.setTextColor(201, 169, 110);
                doc.text("AI Advisor Suggestions", 14, y);
                y += 8;
                
                doc.setFontSize(10);
                doc.setTextColor(0, 0, 0); // WAIT! Was it white?
                currentData.aiAdvice.tips.forEach(tip => {
                    const text = `• [${tip.priority.toUpperCase()}] ${tip.category}: ${tip.action}`;
                    const lines = doc.splitTextToSize(text, 180);
                    doc.text(lines, 14, y);
                    y += (lines.length * 6);
                });
            }

            doc.save(`Vitals-Report-${d.toISOString().slice(0, 10)}.pdf`);
        }
    </script>
</body>
</html>
