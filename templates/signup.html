<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Sign Up — VITALS.IO</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@500;600&family=Manrope:wght@400;500;600&family=Courier+Prime&display=swap" rel="stylesheet" preload>
  
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90' fill='%2300E5FF'%3EV%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" preload>
  
  <style>
    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 80px); /* Account for nav */
      padding: 24px;
      position: relative;
      z-index: 10; /* Above ambient glow */
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px; /* radius-lg */
    }
    .label-custom {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      font-weight: 500;
      display: block;
    }
    .input-custom {
      margin-bottom: 16px;
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-muted);
      margin: 24px 0;
      font-size: 14px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }
    .divider:not(:empty)::before { margin-right: 16px; }
    .divider:not(:empty)::after { margin-left: 16px; }
  </style>
</head>
<body>
  <div class="scanlines"></div>
  <div class="ambient-glow"></div>

  <!-- Shared Navigation -->
  <nav class="nav">
    <div class="container flex justify-between items-center" style="width:100%;">
      <div class="flex items-center">
        <a href="/" class="nav-logo">
          <span class="material-symbols-outlined" style="vertical-align: middle; margin-right: 4px;">insights</span>
          VITALS.IO
        </a>
        <ul class="nav-links">
          <li><a href="/">Home</a></li>
          <li><a href="/product">Product</a></li>
          <li><a href="/solutions">Solutions</a></li>
          <li><a href="/economics">Economics</a></li>
          <li><a href="/api">API</a></li>
          <li><a href="/contact">Contact</a></li>
          <li><a href="/login" class="active" style="color: var(--accent-primary);">Login</a></li>
        </ul>
      </div>
      <div class="flex items-center gap-3">
        <a href="/economics" class="btn btn-primary" style="display: var(--desktop-btn-display, flex);">Get Started</a>
        <button class="mobile-menu-btn" aria-label="Menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </div>
    
    <!-- Mobile Menu -->
    <div class="mobile-menu">
      <a href="/">Home</a>
      <a href="/product">Product</a>
      <a href="/solutions">Solutions</a>
      <a href="/economics">Economics</a>
      <a href="/api">API</a>
      <a href="/contact">Contact</a>
      <a href="/login" class="active" style="color: var(--accent-primary);">Login</a>
      <a href="/economics" class="btn btn-primary mt-2">Get Started</a>
    </div>
  </nav>

  <main style="flex: 1;" class="login-container">
    <div class="login-card fade-in-up">
      <div class="text-center mb-4">
        <div style="display: flex; justify-content: center; align-items: center; margin-bottom: 24px; color: var(--accent-primary);">
          <span class="material-symbols-outlined" style="font-size: 32px; margin-right: 8px;">insights</span>
          <span style="font-family: var(--font-display); font-size: 24px; font-weight: 600;">VITALS.IO</span>
        </div>
        <h1 style="font-family: var(--font-display); font-size: 28px; margin-bottom: 8px;">Create an account</h1>
        <p style="color: var(--text-muted); font-size: 14px;">Sign up to start monitoring your financial health.</p>
      </div>

      <form id="signupForm">
        <div>
          <label class="label-custom" for="fullName">Full Name</label>
          <input type="text" id="fullName" class="input input-custom" placeholder="Jane Doe" required>
        </div>
        <div>
          <label class="label-custom" for="email">Email</label>
          <input type="email" id="email" class="input input-custom" placeholder="founder@startup.com" required>
        </div>
        <div>
          <label class="label-custom" for="password">Password</label>
          <div style="position: relative;">
            <input type="password" id="password" class="input input-custom" placeholder="••••••••" required style="padding-right: 40px;">
            <button type="button" onclick="togglePasswordVisibility('password', 'toggleIcon')" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px;">
              <span id="toggleIcon" class="material-symbols-outlined" style="font-size: 20px;">visibility_off</span>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-full mt-4" style="width: 100%; padding: 14px;">Sign Up</button>
      </form>
      
      <div class="flex justify-center items-center mt-4">
        <a href="/login" class="text-muted" style="font-size: 13px;">Already have an account? <span style="color: var(--accent-primary);">Sign in</span></a>
      </div>
    </div>
  </main>

  <!-- Shared Scripts -->
  <div id="toast-container"></div>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    const supabaseUrl = '{{ SUPABASE_URL | safe }}';
    const supabaseKey = '{{ SUPABASE_ANON_KEY | safe }}';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    document.addEventListener('DOMContentLoaded', () => {
      // 0. Auth State Check for Navigation
      const isLoggedIn = sessionStorage.getItem('isAuthenticated') === 'true' || 
                         Object.keys(localStorage).some(key => key.includes('auth-token') && localStorage.getItem(key));
      if (isLoggedIn) {
        document.querySelectorAll('a[href="/login"]').forEach(link => {
          const li = link.closest('li');
          if (li) {
            li.style.display = 'none';
          } else {
            link.style.display = 'none';
          }
        });
      }

      // Mobile Menu Logic
      const menuBtn = document.querySelector('.mobile-menu-btn');
      const mobileMenu = document.querySelector('.mobile-menu');
      
      if (menuBtn && mobileMenu) {
        menuBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          mobileMenu.classList.toggle('open');
        });
        
        document.addEventListener('click', (e) => {
          if (!mobileMenu.contains(e.target) && !menuBtn.contains(e.target)) {
            mobileMenu.classList.remove('open');
          }
        });
      }

      // Form submission
      const form = document.getElementById('signupForm');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const fullName = document.getElementById('fullName').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        window.showToast('Creating your account...', 'info');
        
        const { data, error } = await supabaseClient.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              full_name: fullName
            }
          }
        });

        if (error) {
          window.showToast(`Error: ${error.message}`, 'error');
        } else {
          sessionStorage.setItem('isAuthenticated', 'true');
          sessionStorage.setItem('userEmail', email);
          window.showToast('Signup successful! Redirecting...', 'success');
          setTimeout(() => {
              window.location.href = '/economics';
          }, 1000);
        }
      });

      // Password toggle logic
      window.togglePasswordVisibility = function(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (input.type === 'password') {
          input.type = 'text';
          icon.textContent = 'visibility';
        } else {
          input.type = 'password';
          icon.textContent = 'visibility_off';
        }
      };
    });

    // Global Toast System
    window.showToast = function(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      
      let icon = 'info';
      if(type === 'success') icon = 'check_circle';
      if(type === 'error') icon = 'error';
      if(type === 'warning') icon = 'warning';
      
      toast.innerHTML = `<span class="material-symbols-outlined">${icon}</span> <span>${message}</span>`;
      container.appendChild(toast);
      
      setTimeout(() => toast.classList.add('show'), 10);
      
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    };
  </script>
</body>
</html>
